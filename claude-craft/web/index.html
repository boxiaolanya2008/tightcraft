<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>claude-craft — Agent</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div id="app">

    <!-- 左侧：会话栏(复刻 Claude Code 布局) -->
    <aside id="sidebar">
      <div class="sb-brand">
        <div class="brand-mark">C</div>
        <span class="brand-name">claude-craft</span>
        <button class="icon-btn" id="btn-help" title="帮助" aria-label="帮助">?</button>
      </div>

      <button class="new-chat" id="btn-new">
        <span>+</span> 新对话 <kbd>⌘N</kbd>
      </button>

      <div class="sb-search">
        <input id="search" type="search" placeholder="搜索对话…" />
      </div>

      <nav id="threads" class="thread-list" aria-label="会话列表"></nav>

      <div class="sb-foot">
        <button class="icon-btn" id="btn-palette" title="命令面板 (⌘K)">⌘</button>
        <button class="icon-btn" id="btn-settings" title="设置">⚙</button>
        <span id="mode-badge" class="mode-badge" title="编辑模式">normal</span>
      </div>
    </aside>

    <!-- 主对话面板 -->
    <main id="main">
      <header id="topbar">
        <div class="tb-title">
          <h1 id="thread-title">新建对话</h1>
          <span id="thread-meta" class="muted"></span>
        </div>
        <div class="tb-actions">
          <button class="chip" id="btn-mode">模式: normal</button>
          <button class="chip" id="btn-theme" title="切换明暗主题">◐</button>
        </div>
      </header>

      <div id="messages" class="messages" aria-live="polite"></div>

      <div id="composer-wrap">
        <div class="composer">
          <textarea id="prompt" rows="1"
            placeholder="描述一个任务，或问我任何事…  Enter 发送，Shift+Enter 换行"
            autocomplete="off"></textarea>
          <div class="composer-foot">
            <div class="composer-left">
              <button class="chip mini" id="btn-mode-mini" title="切换编辑模式">normal</button>
            </div>
            <div class="composer-right">
              <kbd class="hint">⌘K 命令</kbd>
              <button class="send" id="btn-send" title="发送 (Enter)" disabled>&#10148;</button>
            </div>
          </div>
        </div>
        <p class="composer-note mute">Enter 发送 · Shift+Enter 换行 · 离线演示模式</p>
      </div>
    </main>

    <!-- 命令面板 -->
    <div id="palette" class="overlay hidden" role="dialog" aria-label="命令面板">
      <div class="palette">
        <input id="palette-input" placeholder="输入命令…" autocomplete="off" />
        <ul id="palette-list"></ul>
      </div>
    </div>

    <!-- 设置弹层 -->
    <div id="settings" class="overlay hidden" role="dialog" aria-label="设置">
      <div class="modal">
        <h3>设置</h3>
        <label class="row"><span>编辑模式</span>
          <select id="set-mode">
            <option value="normal">normal — 只读</option>
            <option value="accept">accept edits — 允许受控写入</option>
          </select>
        </label>
        <label class="row"><span>主题</span>
          <select id="set-theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
          </select>
        </label>
        <div class="modal-foot">
          <button class="btn" id="close-settings">完成</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/app.js" defer></script>
</body>
</html>
