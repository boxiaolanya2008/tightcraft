[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-craft"
version = "0.1.0"
description = "自研 Agent 框架：执行循环 + 工具系统 + 规划器 + 指纹记忆，零依赖"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "agent-craft" }]

[project.scripts]
agent-craft = "agentcraft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]